[project]
name = "neural-guided-geometry-reasoner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.12.5",
    "openai==2.54.0",
    "python-dotenv==1.2.3",
    "Pillow==12.3.0",
    "ollama>=0.6.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "httpx==0.28.1",
]

[tool.uv]
package = false
default-groups = ["dev"]
